#@TYPE: Machine
#@NAME: versal-2vp-vpk360-multidomain
#@DESCRIPTION: Segmented SDT machine for the AMD Versal Premium VPK360 evaluation kit: Cortex-A72 Linux plus MicroBlaze PMC/PSM firmware sub-machines.

BBMULTICONFIG += "versal-2vp-vpk360-multidomain-microblaze-pmc versal-2vp-vpk360-multidomain-microblaze-psm versal-2vp-vpk360-multidomain-cortexr5-0-freertos versal-2vp-vpk360-multidomain-cortexr5-1-baremetal"
MACHINEOVERRIDES .= ":versal-2vp-vpk360-sdt-seg"

#### Preamble
MACHINEOVERRIDES =. "${@['', 'versal-2vp-vpk360-multidomain:']['versal-2vp-vpk360-multidomain' !='${MACHINE}']}"
#### Regular settings follow
TUNEFILE[microblaze-pmc] = "conf/machine/include/versal-2vp-vpk360-multidomain/microblaze.inc"
TUNEFILE[microblaze-psm] = "conf/machine/include/versal-2vp-vpk360-multidomain/microblaze.inc"

# Platform Loader and Manager
PLM_DEPENDS = ""
PLM_MCDEPENDS = "mc::versal-2vp-vpk360-multidomain-microblaze-pmc:plm-firmware:do_deploy"
PLM_DEPLOY_DIR = "${TMPDIR}-versal-2vp-vpk360-multidomain-microblaze-pmc/deploy/images/${MACHINE}"

# PSM Firmware
PSM_DEPENDS = ""
PSM_MCDEPENDS = "mc::versal-2vp-vpk360-multidomain-microblaze-psm:psm-firmware:do_deploy"
PSM_FIRMWARE_DEPLOY_DIR = "${TMPDIR}-versal-2vp-vpk360-multidomain-microblaze-psm/deploy/images/${MACHINE}"

# Set the default (linux) domain device tree
CONFIG_DTFILE_DIR := "${@bb.utils.which(d.getVar('BBPATH'), 'conf/dts/versal-2vp-vpk360-multidomain')}"
CONFIG_DTFILE ?= "${CONFIG_DTFILE_DIR}/cortexa72-linux.dts"
CONFIG_DTFILE[vardepsexclude] += "CONFIG_DTFILE_DIR"

DTB_FILE_PATH ?= "${RECIPE_SYSROOT}/boot/devicetree/${@os.path.basename(d.getVar('CONFIG_DTFILE').replace('.dts', '.dtb'))}"

# Serial Console Settings
SERIAL_CONSOLES ?= "115200;ttyAMA0"

# Yocto arm-trusted-firmware(TF-A) variables
TFA_CONSOLE ?= "pl011"
TFA_BL33_LOAD ?= "0x8000000"

# Yocto u-boot-xlnx variables

# Set DDR Base address for u-boot-xlnx-scr variables
DDR_BASEADDR ?= "0x0"
SKIP_APPEND_BASEADDR ?= "0"

# Yocto KERNEL Variables
UBOOT_ENTRYPOINT ?= "0x200000"
UBOOT_LOADADDRESS ?= "0x200000"

# Yocto MACHINE_FEATURES Variable
MACHINE_FEATURES += "fpga-overlay efi"

# ID Code, can be found in SDTGen bif file
BIF_TOPLEVEL_ATTR[id_code] = "0x4c74093"

# Required generic machine inclusion
require conf/machine/versal-2vp-generic.conf

# QEMU Memory Configuration
QB_MEM = "-machine dynamic-mem=on -device amd-ddr-memory,address=0x800000000,size=0x180000000 -device amd-ddr-memory,address=0x50000000000,size=0x200000000 -device amd-ddr-memory,address=0x60000000000,size=0x100000000"

QEMU_HW_DTB_PS = "${QEMU_HW_DTB_PATH}/board-versal2-ps-vpk360.dtb"
QEMU_HW_DTB_PMC = "${QEMU_HW_DTB_PATH}/board-versal2-pmc-vpk360.dtb"
QEMU_FLASH_TYPE = "ospi"
# OSPI flash size (256MB)
SPI_IMAGE_SIZE = "0x1000_0000"
QEMU_HW_BOOT_MODE = "8"
QEMU_HW_OSPI_FILE = "qemu-ospi-${MACHINE}.bin"
QEMU_SECONDARY_BOOT_MODE = "14"
QB_ROOTFS_OPT = "-drive if=sd,index=1,file=@ROOTFS@,format=raw"
# Enable meta-xilinx-imgrcvry if available
include conf/enable-xilinx-imgrcvry.conf
# Enables the restoration of the multi-boot register for A/B firmware platforms
XLNX_CMAKE_BSP_VARS:pn-xilplmi:append = " -DPLM_ENABLE_RESTORE_MULTIBOOT"
# Enable Push Button support
CFLAGS:pn-image-selector:append = " -DXIS_ENABLE_PB"
# Image recovery kernel address
IMGRCVRY_KERNEL_ADDR = "0x20200000"
# Image recovery rootfs address
IMGRCVRY_ROOTFS_ADDR = "0x24000000"
# Preboot config file
PREBOOT_CFG_FILE = "file://preboot_cmd_versal_2vp.cfg"
# UEFI Capsule Update / LVFS Configuration
PRODUCT_NAME = "VPK360"
PRODUCT_GUID = "2ca0d16b-dcc2-5ee5-95bd-c9551224d78f"
PRODUCT_URL = "https://www.amd.com/en/products/adaptive-socs-and-fpgas/versal.html"
# Enable libmetal application
BOOTBIN_INC = "libmetal-demo-rpu1.inc"

# This is an 'SDT' based BSP
XILINX_WITH_ESW = "sdt"

# Original SDT artifacts URL
SDT_URI = "https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1.1/2026.1.1_0816_1_08170047/external/versal-2vp-vpk360-sdt-seg/versal-2vp-vpk360-sdt-seg_2026.1.1_0816_1_08170047.tar.gz"
SDT_URI[sha256sum] = "06b5f61a6003443b72e3ef85b2645c78325db4a2a874cd55a88a6f60c623571a"
SDT_URI[S] = "${WORKDIR}/versal-2vp-vpk360-sdt-seg_2026.1.1_0816_1_08170047"

# Set the system device trees
SYSTEM_DTFILE_DEPENDS = "sdt-artifacts"
SYSTEM_DTFILE_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
SYSTEM_DTFILE = "${SYSTEM_DTFILE_DIR}/system-top.dts"

# Load the dynamic machine features
include conf/machine/include/versal-2vp-vpk360-multidomain/${BB_CURRENT_MC}-features.conf
LIBXIL_CONFIG = "conf/machine/include/versal-2vp-vpk360-multidomain/${BB_CURRENT_MC}-libxil.conf"

# PDI variables
PDI_PATH_DEPENDS = "sdt-artifacts"
PDI_PATH_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
PDI_PATH = "${PDI_PATH_DIR}/vpk360_base_boot.pdi"

# Primary Bootmode value
DEFAULT_HW_BOOT_MODE = "8"

# Update bootbin to use proper device tree
BIF_PARTITION_IMAGE[device-tree] = "${DTB_FILE_PATH}"

# Remap boot files to ensure the right device tree is listed first
IMAGE_BOOT_FILES =+ "devicetree/${@os.path.basename(d.getVar('CONFIG_DTFILE').replace('.dts', '.dtb'))}"
PACKAGE_EXTRA_ARCHS:append = " versal_2vp_vpk360_sdt_seg"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' versal_2vp_vpk360_multidomain']['versal-2vp-vpk360-multidomain' != '${MACHINE}']}"
