#@TYPE: Machine
#@NAME: mbv32-scu200-zephyr-sdt
#@DESCRIPTION: Machine configuration for the mbv32-scu200-zephyr-sdt boards.


#### Preamble
MACHINEOVERRIDES =. "${@['', 'mbv32-scu200-zephyr-sdt:']['mbv32-scu200-zephyr-sdt' !='${MACHINE}']}"
#### Regular settings follow

# MicroBlaze V Tune features Settings
DEFAULTTUNE = "microblaze-v"
require conf/machine/include/mbv32-scu200-zephyr-sdt/microblaze-v.inc

# Zephyr RTOS settings
ZEPHYR_BOARD = "mbv32"
ARCH = "riscv32"

# Warn if this machine is used with a non-Zephyr DISTRO
INHERIT += "xilinx-deprecated"
XILINX_DEPRECATED[mbv32-scu200-zephyr-sdt] = "${@'This configuration is only intended for use with DISTRO set to amd-zephyr.  It will likely fail with other configurations.' if (d.getVar('DISTRO') != 'amd-zephyr') else ''}"

# Set the default (zephyr) domain device tree
CONFIG_DTFILE_DIR := "${@bb.utils.which(d.getVar('BBPATH'), 'conf/dts/mbv32-scu200-zephyr-sdt')}"
CONFIG_DTFILE ?= "${CONFIG_DTFILE_DIR}/microblaze-riscv-zephyr.dts"
CONFIG_DTFILE[vardepsexclude] += "CONFIG_DTFILE_DIR"
ZEPHYR_SDT_BOARD_KCONFIG_DEFCONFIG = "${CONFIG_DTFILE_DIR}/microblaze-riscv-zephyr-board_Kconfig.defconfig"

# This is an 'SDT' based BSP
XILINX_WITH_ESW = "sdt"

# Original SDT artifacts URL
SDT_URI = "https://edf.amd.com/sswreleases/rel-v2026.2/sdt/2026.2/2026.2_0913_1_09130540/external/mbv32-scu200-zephyr-sdt/mbv32-scu200-zephyr-sdt_2026.2_0913_1_09130540.tar.gz"
SDT_URI[sha256sum] = "19e40e142da1179aef4e8b33611df857c1048692a0db54ab9520c6bc55346160"
SDT_URI[S] = "${UNPACKDIR}/mbv32-scu200-zephyr-sdt_2026.2_0913_1_09130540"

# PDI variables
PDI_PATH_DEPENDS = "sdt-artifacts"
PDI_PATH_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
PDI_PATH = "${PDI_PATH_DIR}/scu200_zephyr_32bit.pdi"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' mbv32_scu200_zephyr_sdt']['mbv32-scu200-zephyr-sdt' != '${MACHINE}']}"
