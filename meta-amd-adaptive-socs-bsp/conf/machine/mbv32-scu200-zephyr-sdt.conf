#@TYPE: Machine
#@NAME: mbv32-scu200-zephyr-sdt
#@DESCRIPTION: Machine configuration for Zephyr on the AMD SCU200 board with a 32-bit AMD MicroBlaze V processor.

#### Preamble
MACHINEOVERRIDES =. "${@['', 'mbv32-scu200-zephyr-sdt:']['mbv32-scu200-zephyr-sdt' != '${MACHINE}']}"
#### Regular settings follow

require conf/machine/include/riscv/tune-riscv.inc

DEFAULTTUNE = "riscv32"
TUNE_FEATURES:tune-riscv32 = "${@oe.tune.riscv_isa_to_tune("rv32imac_zicbom_zicsr_zifencei")}"

DISTRO = "amd-zephyr"
ZEPHYR_BOARD = "mbv32"
ARCH = "riscv32"

CONFIG_DTFILE_DIR := "${@bb.utils.which(d.getVar('BBPATH'), 'conf/dts/mbv32-scu200-zephyr-sdt')}"
CONFIG_DTFILE = "${CONFIG_DTFILE_DIR}/mbv32-scu200-zephyr-sdt.dts"
CONFIG_DTFILE[vardepsexclude] += "CONFIG_DTFILE_DIR"

ZEPHYR_SDT_BOARD_KCONFIG_DEFCONFIG = "${CONFIG_DTFILE_DIR}/mbv32-scu200-zephyr-sdt-board_Kconfig.defconfig"

# This is an 'SDT' based BSP
XILINX_WITH_ESW = "sdt"

# Original SDT artifacts URL
SDT_URI = "https://edf.amd.com/sswreleases/rel-v2026.2/sdt/2026.2/2026.2_0811_1_08110739/external/mbv32-scu200-sdt/mbv32-scu200-sdt_2026.2_0811_1_08110739.tar.gz"
SDT_URI[sha256sum] = "57479429eaa01d190871a4c2df13376c83e2796bef360d38facf4312142b2c2f"
SDT_URI[S] = "${UNPACKDIR}/mbv32-scu200-sdt_2026.2_0811_1_08110739"

# PDI variables
PDI_PATH_DEPENDS = "sdt-artifacts"
PDI_PATH_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
PDI_PATH = "${PDI_PATH_DIR}/scu200_zephyr_32bit.pdi"

do_deploy[depends] += "${@'sdt-artifacts:do_deploy' if d.getVar('PN').startswith('zephyr-') else ''}"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' mbv32_scu200_zephyr_sdt']['mbv32-scu200-zephyr-sdt' != '${MACHINE}']}"