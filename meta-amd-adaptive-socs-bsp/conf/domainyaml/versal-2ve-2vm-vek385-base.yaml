domains:
  APU_Linux:
    compatible: openamp,domain-v1
    cpus:
      - cluster: cpus_a78
        cpumask: 0xff
        mode:
          secure: false
          el: 0x3
    os,type: linux
    chosen:
      stdout-path: "serial1:115200n8"
      bootargs: "earlycon=pl011,mmio32,0xf1930000 console=ttyAMA1,115200"