domains:
  RPU_Zephyr:
    compatible: openamp,domain-v1
    cpus:
      - cluster: cpus_r52_0
        cpumask: 0x1
        mode:
          secure: true
          el: 0x3
    os,type: zephyr
    chosen:
      stdout-path: "serial0:115200n8"
      bootargs: "earlycon=pl011,mmio32,0xf1930000 console=ttyAMA1,115200"
      zephyr,console: "serial0"
      zephyr,shell-uart: "serial0"
