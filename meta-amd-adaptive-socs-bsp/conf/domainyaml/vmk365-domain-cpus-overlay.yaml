# VMK365 has four Cortex-A78 CPUs; masks are relative to the cluster.
# Merge this board override for every domain generation pass.
domains:
  APU_Linux:
    compatible: openamp,domain-v1
    cpus:
      - cluster: cpus_a78
        cpumask: 0x0f
        mode:
          secure: false
          el: 0x3
    os,type: linux
