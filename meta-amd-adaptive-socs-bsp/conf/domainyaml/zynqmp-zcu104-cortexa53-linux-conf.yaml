reserved-memory:
  ranges: true
  "#size-cells": 2
  "#address-cells": 2

  cma_reserved@00000000:
    label: cma_reserved_0
    start: 0x00000000
    size: 750M
    compatible: "shared-dma-pool"
    reusable: true
    linux,cma-default: true

domains:
  APU_Linux:
    compatible:
      - "openamp,domain-v1"
    cpus:
      - cluster: cpus_a53
        cpumask: 0xf
        mode:
          secure: true
          el: 0x3
    os,type: linux
    reserved-memory:
      - cma_reserved@00000000
