domains:
  APU_Linux:
    compatible: openamp,domain-v1
    access:
      - dev: "*"
      - dev: iommu@ec000000
      # Preserve USB glue and GPU support nodes omitted from device discovery.
      - dev: mmi-usb
      - dev: mmi_gpu_slcr@ed720000
      - dev: physical-memory-group-manager
    memory:
      - "*"

  RPU_Zephyr:
    compatible: openamp,domain-v1
    access:
      - dev: serial@f1920000

  RPU_1_BM:
    compatible: openamp,domain-v1
    access:
      - dev: serial@f1920000
