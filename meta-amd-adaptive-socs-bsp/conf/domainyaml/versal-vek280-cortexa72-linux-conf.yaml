reserved-memory:
  ranges: true
  "#size-cells": 2
  "#address-cells": 2

  cma_reserved@50000000000:
    label: cma_reserved_50000000000
    start: 0x50000000000
    size: 3G
    compatible: "shared-dma-pool"
    reusable: true
    linux,cma-default: true

  cma_reserved@60000000000:
    label: cma_reserved_60000000000
    start: 0x60000000000
    size: 3G
    compatible: "shared-dma-pool"
    reusable: true
    linux,cma-default: true


domains:
  APU_Linux:
    compatible:
      - "openamp,domain-v1"
    cpus:
      - cluster: cpus_a72
        cpumask: 0xf
        mode:
          secure: true
          el: 0x3
    os,type: linux
    reserved-memory:
      - cma_reserved@50000000000
      - cma_reserved@60000000000
