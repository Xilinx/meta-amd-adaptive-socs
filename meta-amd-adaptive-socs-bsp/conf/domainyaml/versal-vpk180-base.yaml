domains:
  APU_Linux:
    compatible:
      - "openamp,domain-v1"
    cpus:
      - cluster: cpus_a72
        cpumask: 0xf
        mode:
          secure: true
          el: 0x3
    os,type: linux
    chosen:
      bootargs: "console=ttyAMA0 earlycon=pl011,mmio32,0xFF000000,115200n8 versal_sysmon.secure_mode=1"
      stdout-path: "serial0:115200n8"