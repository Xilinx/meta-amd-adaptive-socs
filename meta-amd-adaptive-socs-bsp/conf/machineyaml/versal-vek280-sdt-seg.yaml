args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0217_1_02181146/external/versal-vek280-sdt-seg/versal-vek280-sdt-seg_2026.1_0217_1_02181146.tar.gz
    - --machine-name versal-vek280-sdt-seg
    - -g full

kconfig:
    CONFIG_YOCTO_BBMC_LINUX_DTSI: \
        ${BSPLAYERDIR_amd-adaptive-socs-bsp}/recipes-bsp/device-tree/files/versal-vek280-sdt-seg-system-conf.dtsi

machine:
    pre:
    post:
        QB_MEM:
            op: '='
            val: "-m 12G"
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-vek280.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
        QEMU_HW_BOOT_MODE:
            op: '?='
            val: "5"
        QEMU_FLASH_TYPE:
            op: '?='
            val: "ospi"
        QEMU_HW_SD_FILE:
            op: '?='
            val: "qemu-ospi-${MACHINE}.bin"
        QB_OPT_APPEND:append:
            op: ':='
            val: " -drive file=@DEPLOY_DIR_IMAGE@/${QEMU_HW_SD_FILE},if=mtd,format=raw,index=4"
