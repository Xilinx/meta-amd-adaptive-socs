args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0420_1_04200422/external/versal-vek280-sdt-seg/versal-vek280-sdt-seg_2026.1_0420_1_04200422.tar.gz
    - --machine-name versal-vek280-sdt-seg
    - -g full
    - --domain-file ${BSPLAYERDIR_amd-adaptive-socs-bsp}/conf/domainyaml/versal-vek280-cortexa72-linux-conf.yaml

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_5: y

machine:
    pre:
    post:
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-vek280.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
        QEMU_FLASH_TYPE:
            op: '='
            val: 'ospi'
        SPI_IMAGE_SIZE:
            comment: 'OSPI flash size (256M)'
            op: '='
            val: '0x1000_0000'
