args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.2/sdt/2026.2/2026.2_1027_1_10270632/external/versal-vpk120-sdt-seg/versal-vpk120-sdt-seg_2026.2_1027_1_10270632.tar.gz
    - --machine-name versal-vpk120-sdt-seg
    - -g full

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_5: y

machine:
    description: >-
        Segmented SDT machine for the AMD Versal Premium VPK120
        evaluation kit: Cortex-A72 Linux plus MicroBlaze PMC/PSM
        firmware sub-machines.
    post:
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-vpk120.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
        QEMU_FLASH_TYPE:
            op: '='
            val: 'qspi'

