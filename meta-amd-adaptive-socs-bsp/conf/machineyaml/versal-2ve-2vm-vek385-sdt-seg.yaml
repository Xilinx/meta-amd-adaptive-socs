args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0420_1_04200422/external/versal-2ve-2vm-vek385-sdt-seg/versal-2ve-2vm-vek385-sdt-seg_2026.1_0420_1_04200422.tar.gz
    - --machine-name versal-2ve-2vm-vek385-sdt-seg
    - -g full
    - --domain-file ${BSPLAYERDIR_amd-adaptive-socs-bsp}/conf/domainyaml/versal-2ve-2vm-vek385-base.yaml

kconfig:
    CONFIG_YOCTO_BBMC_MICROBLAZE_RISCV_ASU: n
    CONFIG_SUBSYSTEM_SERIAL_SERIAL1_SELECT: y
    CONFIG_SUBSYSTEM_TF-A_SERIAL_SERIAL1_SELECT: y
    CONFIG_SUBSYSTEM_TF-A_MEMORY_SETTINGS: y
    CONFIG_SUBSYSTEM_TF-A_MEM_BASE: '0x1600000'
    CONFIG_SUBSYSTEM_TF-A_MEM_SIZE: '0x200000'
    CONFIG_SUBSYSTEM_BOOTMODE_8: y

machine:
    post:
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal2-psxc-vek385.dtb"
        QEMU_HW_SERIAL:
            op: '='
            val: "-serial null -serial null -serial null -serial mon:stdio"
        QEMU_FLASH_TYPE:
            op: '='
            val: 'ospi'
        QB_DEFAULT_FSTYPE:
            op: '='
            val: "wic.ufs"
        SPI_IMAGE_SIZE:
            comment: 'OSPI flash size (256M)'
            op: '='
            val: '0x1000_0000'
        QEMU_SECONDARY_BOOT_MODE:
            op: '='
            val: '11'
