args:
    - --hw-description https://petalinux.xilinx.com/sswreleases/rel-v2025.2/sdt/2025.2/2025.2_0915_1_09160540/external/versal-l20-sdt-seg/versal-l20-sdt-seg_2025.2_0915_1_09160540.tar.gz
    - --machine-name versal-l20-sdt-seg
    - -g full
    - --domain-file ${LAYER_PATH_xilinx-standalone-sdt}/recipes-libraries/open-amp/overlays/openamp-overlay-versal.yaml
kconfig:

machine:
    pre:
    post:
        QB_MEM:
            op: '='
            val: "-m 8G"
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-vm-p-m1369-00.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
        QB_ROOTFS_OPT:
            op: '='
            val: "-drive if=sd,index=1,file=@ROOTFS@,format=raw"
