inherit:
    ${BSPLAYERDIR_amd-adaptive-socs-bsp}/conf/machineyaml/versal-2ve-2vm-vmk365-sdt-seg.yaml

args:
    - --machine-name versal-2ve-2vm-vmk365-multidomain
    - --domain-file ${LAYER_PATH_xilinx-standalone-sdt}/conf/domainyaml/versal-2ve-2vm-multidomain-base.yaml \
                    ${BSPLAYERDIR_amd-adaptive-socs-bsp}/conf/domainyaml/vmk365-domain-access-overlay.yaml \
                    ${LAYER_PATH_xilinx-standalone-sdt}/conf/domainyaml/versal-2ve-2vm-openamp-overlay.yaml \
                    ${LAYER_PATH_xilinx-standalone-sdt}/conf/domainyaml/versal-2ve-2vm-libmetal-overlay.yaml
kconfig:
    CONFIG_YOCTO_BBMC_LINUX_DTSI: \
        ${LAYER_PATH_xilinx-virtualization}/recipes-bsp/device-tree/files/versal-2ve-2vm-xen.dtsi \
        ${BSPLAYERDIR_amd-adaptive-socs-bsp}/recipes-bsp/device-tree/files/platform-misc.dtsi
    CONFIG_SUBSYSTEM_OPTEE: y
    CONFIG_SUBSYSTEM_MICROBLAZE_PMC_SERIAL_SERIAL0_SELECT: y
    CONFIG_SUBSYSTEM_CORTEXR52_0_ZEPHYR_SERIAL_SERIAL0_SELECT: y
    CONFIG_SUBSYSTEM_CORTEXR52_1_BAREMETAL_SERIAL_SERIAL0_SELECT: y
    CONFIG_SUBSYSTEM_DT_DOMAIN_ACCESS: y

machine:
    post:
        BOOTBIN_INC:
            comment: 'Enable libmetal application'
            op: '='
            val: 'libmetal-demo-rpu1.inc'
