args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0217_1_02181146/external/versal-vpk180-sdt-seg/versal-vpk180-sdt-seg_2026.1_0217_1_02181146.tar.gz
    - --machine-name versal-vpk180-sdt-seg
    - -g full

kconfig:
    CONFIG_YOCTO_BBMC_LINUX_DTSI: ${BSPLAYERDIR_amd-adaptive-socs-bsp}/recipes-bsp/device-tree/files/versal-vpk180-sdt-seg-system-conf.dtsi

machine:
    post:
        QB_MEM:
            op: '='
            val: "-m 8G"
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-vpk180.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
        QB_ROOTFS_OPT:
            op: '='
            val: "-drive if=sd,index=1,file=@ROOTFS@,format=raw"
