args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0415_1_04151526/external/versal-vpk180-sdt-seg/versal-vpk180-sdt-seg_2026.1_0415_1_04151526.tar.gz
    - --machine-name versal-vpk180-sdt-seg
    - -g full
    - --domain-file ${BSPLAYERDIR_amd-adaptive-socs-bsp}/conf/domainyaml/versal-vpk180-base.yaml

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_14: y

machine:
    post:
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-vpk180.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
