inherit:
    ${BSPLAYERDIR_amd-adaptive-socs-bsp}/conf/machineyaml/versal-vck190-sdt-seg.yaml

args:
    - --machine-name versal-vck190-multidomain
    - --domain-file ${LAYER_PATH_xilinx-standalone-sdt}/conf/domainyaml/versal-multidomain-base.yaml \
                    ${BSPLAYERDIR_amd-adaptive-socs-bsp}/conf/domainyaml/versal-domain-access-overlay.yaml \
                    ${LAYER_PATH_xilinx-standalone-sdt}/conf/domainyaml/versal-openamp-zephyr-common-overlay.yaml \
                    ${LAYER_PATH_xilinx-standalone-sdt}/conf/domainyaml/versal-openamp-zephyr-cips-overlay.yaml \
                    ${LAYER_PATH_xilinx-standalone-sdt}/conf/domainyaml/versal-libmetal-overlay.yaml

kconfig:
    CONFIG_SUBSYSTEM_DT_DOMAIN_ACCESS: y
    CONFIG_YOCTO_BBMC_LINUX_DTSI: \
        ${BSPLAYERDIR_amd-adaptive-socs-bsp}/recipes-bsp/device-tree/files/qspi-2g-memory-map.dtsi \
        ${LAYER_PATH_xilinx-virtualization}/recipes-bsp/device-tree/files/versal-xen.dtsi \
        ${BSPLAYERDIR_amd-adaptive-socs-bsp}/recipes-bsp/device-tree/files/platform-misc.dtsi
 
machine:
    description: >-
        AMP/multidomain machine for the AMD Versal AI Core VCK190
        evaluation kit: Cortex-A72 Linux, Cortex-R5 FreeRTOS/baremetal,
        and MicroBlaze PMC/PSM sub-machines built from system device
        tree.
    post:
        include:
            comment: "Enable meta-xilinx-imgrcvry if available"
            op: 'conf/enable-xilinx-imgrcvry.conf'
        EXTRA_OECMAKE:append:pn-xilplmi:
            comment: 'Enables the restoration of the multi-boot register for A/B firmware platforms'
            op: '='
            val: ' -DXILPLMI_pm_restore_multiboot=ON'
        CFLAGS:append:pn-image-selector:
            comment: 'Enable QSPI flash'
            op: '='
            val: ' -DXIS_QSPI_FLSH'
        BOOTBIN_INC:
            comment: 'Enable libmetal application'
            op: '='
            val: 'libmetal-demo-rpu1.inc'
        SPI_IMAGE_SIZE:
            comment: 'QSPI flash size (256MB) - XBM daughter card'
            op: '='
            val: '0x1000_0000'
        SPI_BOOTBIN_OFFSET:
            comment: 'Boot.bin A/B offsets for 256MB QSPI'
            op: '='
            val: '0x15C_0000 0x880_0000'
        SPI_USER_SCRATCH_OFFSET:
            op: '='
            val: '0xFA4_0000'
        SPI_MANIFEST_OFFSET:
            op: '='
            val: '0xFFF_0000'
        PRODUCT_NAME:
            comment: 'UEFI Capsule Update / LVFS Configuration'
            op: '='
            val: 'VCK190'
        PRODUCT_GUID:
            op: '='
            val: 'a9b6d4f0-23e1-4f88-a7b4-6d83f1d2c92e'
        PRODUCT_URL:
            op: '='
            val: 'https://www.amd.com/en/products/adaptive-socs-and-fpgas/versal.html'
