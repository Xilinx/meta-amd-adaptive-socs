args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0425_1_04250544/external/versal-vm-p-m1369-00-reva-x-prc-01-reva-sdt-seg/versal-vm-p-m1369-00-reva-x-prc-01-reva-sdt-seg_2026.1_0425_1_04250544.tar.gz
    - --machine-name versal-vm-p-m1369-00-reva-x-prc-01-reva-sdt-seg
    - -g full

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_5: y

machine:
    post:
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-vm-p-m1369-00.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
