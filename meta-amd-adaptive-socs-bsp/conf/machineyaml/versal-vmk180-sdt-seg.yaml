args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0217_1_02181146/external/versal-vmk180-sdt-seg/versal-vmk180-sdt-seg_2026.1_0217_1_02181146.tar.gz
    - --machine-name versal-vmk180-sdt-seg
    - -g full

machine:
    post:
        QB_MEM:
            op: '='
            val: "-m 8G"
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-vmk180.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
        QB_ROOTFS_OPT:
            op: '='
            val: "-drive if=sd,index=1,file=@ROOTFS@,format=raw"
