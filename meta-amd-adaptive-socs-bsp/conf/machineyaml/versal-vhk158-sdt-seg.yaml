args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.2/sdt/2026.2/2026.2_1015_1_10150534/external/versal-vhk158-sdt-seg/versal-vhk158-sdt-seg_2026.2_1015_1_10150534.tar.gz
    - --machine-name versal-vhk158-sdt-seg
    - -g full

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_5: y

machine:
    description: >-
        Segmented SDT machine for the AMD Versal Prime VHK158 evaluation
        kit: Cortex-A72 Linux plus MicroBlaze PMC/PSM firmware
        sub-machines.
    post:
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-vhk158.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
        QEMU_FLASH_TYPE:
            op: '='
            val: 'ospi'
        SPI_IMAGE_SIZE:
            comment: 'OSPI flash size (256M)'
            op: '='
            val: '0x1000_0000'
