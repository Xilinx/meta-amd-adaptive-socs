args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0310_1_03110137/external/versal-vck190-sdt-seg/versal-vck190-sdt-seg_2026.1_0310_1_03110137.tar.gz
    - --machine-name versal-vck190-sdt-seg
    - -g full

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_5: y

machine:
    post:
        QB_MEM:
            op: '='
            val: "-m 8G"
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-vck190.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
        QEMU_FLASH_TYPE:
            op: '='
            val: 'qspi'
        SPI_IMAGE_SIZE:
            comment: 'QSPI Flash size (128M)'
            op: '='
            val: "0x800_0000"
        IMAGE_B_OFFSET:
            op: '='
            val: "0x47C_0000"
        USER_SCRATCHPAD_OFFSET:
            op: '='
            val: "0x7A0_0000"
