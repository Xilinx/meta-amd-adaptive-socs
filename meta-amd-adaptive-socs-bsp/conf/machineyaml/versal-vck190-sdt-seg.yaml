args:
    - --hw-description https://petalinux.xilinx.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_1027_1_10281207/external/versal-vck190-sdt-seg/versal-vck190-sdt-seg_2026.1_1027_1_10281207.tar.gz
    - --machine-name versal-vck190-sdt-seg
    - -g full
    - --domain-file ${LAYER_PATH_xilinx-standalone-sdt}/conf/domainyaml/openamp-overlay-versal.yaml
kconfig:
    CONFIG_YOCTO_BBMC_LINUX_DTSI: ${LAYER_PATH_xilinx-virtualization}/recipes-bsp/device-tree/files/versal-xen.dtsi
machine:
    pre:
    post:
        include:
            comment: "Enable meta-xilinx-imgrcvry if available"
            op: 'conf/enable-xilinx-imgrcvry.conf'
        QB_MEM:
            op: '='
            val: "-m 8G"
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-vck190.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
        QB_ROOTFS_OPT:
            op: '='
            val: "-drive if=sd,index=1,file=@ROOTFS@,format=raw"
        ENABLE_XEN_DTSI:
            comment: "Temporarily enable XEN and XEN QEMU DTSI to system.dtb"
            op: '='
            val: "1"
        ENABLE_XEN_QEMU_DTSI:
            op: '='
            val: "1"
