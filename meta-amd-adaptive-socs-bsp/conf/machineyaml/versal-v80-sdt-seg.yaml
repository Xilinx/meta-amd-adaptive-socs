args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0303_1_03040531/external/versal-v80-sdt-seg/versal-v80-sdt-seg_2026.1_0303_1_03040531.tar.gz
    - --machine-name versal-v80-sdt-seg
    - -g full

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_8: y

machine:
    post:
        QB_MEM:
            op: '='
            val: "-m 8G"
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-v80.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
        QEMU_HW_OSPI_FILE:
            op: '='
            val: "qemu-ospi-${MACHINE}.bin"
        QB_OPT_APPEND:append:
            op: ':='
            val: " -drive file=@DEPLOY_DIR_IMAGE@/${QEMU_HW_OSPI_FILE},if=mtd,format=raw,index=4"
        QB_ROOTFS_OPT:
            op: '='
            val: "-drive if=sd,index=2,file=@ROOTFS@,format=raw"
