args:
    - --hw-description https://petalinux.xilinx.com/sswreleases/rel-v2025.2/sdt/2025.2/2025.2_0913_1_09132305/external/zynqmp-zcu102-sdt-full/zynqmp-zcu102-sdt-full_2025.2_0913_1_09132305.tar.gz
    - --machine-name zynqmp-zcu102-sdt-full
    - -g full
kconfig:

machine:
    pre:
    post:
        QB_MEM:
            op: '='
            val: "-m 4G"
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-zynqmp-zcu102.dtb"
        QEMU_HW_DTB_PMU:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/zynqmp-pmu.dtb"

