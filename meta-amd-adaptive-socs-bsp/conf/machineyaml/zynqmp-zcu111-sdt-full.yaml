args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0330_1_03310000/external/zynqmp-zcu111-sdt-full/zynqmp-zcu111-sdt-full_2026.1_0330_1_03310000.tar.gz
    - --machine-name zynqmp-zcu111-sdt-full
    - -g full

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_5: y

machine:
    post:
        QB_MEM:
            op: '='
            val: "-m 4G"
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-zynqmp-zcu102.dtb"
        QEMU_HW_DTB_PMU:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/zynqmp-pmu.dtb"
