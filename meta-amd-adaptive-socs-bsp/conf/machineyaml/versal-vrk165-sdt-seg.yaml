args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0225_1_02260207/external/versal-vrk165-sdt-seg/versal-vrk165-sdt-seg_2026.1_0225_1_02260207.tar.gz
    - --machine-name versal-vrk165-sdt-seg
    - -g full

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_8: y

machine:
    post:
        QB_MEM:
            op: '='
            val: "-m 12G"
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-vrk165.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
        QEMU_HW_OSPI_FILE:
            op: '='
            val: "qemu-ospi-${MACHINE}.bin"
        QB_OPT_APPEND:append:
            op: ':='
            val: " -drive file=@DEPLOY_DIR_IMAGE@/${QEMU_HW_OSPI_FILE},if=mtd,format=raw,index=4"
