args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.2/sdt/2026.2/2026.2_0724_1_07241050/external/versal-vrk160-sdt-seg/versal-vrk160-sdt-seg_2026.2_0724_1_07241050.tar.gz
    - --machine-name versal-vrk160-sdt-seg
    - -g full

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_8: y

machine:
    description: >-
        Segmented SDT machine for the AMD Versal RF VRK160 evaluation
        kit: Cortex-A72 Linux plus MicroBlaze PMC/PSM firmware
        sub-machines.
    post:
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-ps-vrk160.dtb"
        QEMU_HW_DTB_PMC:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-versal-pmc-virt.dtb"
        QEMU_FLASH_TYPE:
            op: '='
            val: 'ospi'
        SPI_IMAGE_SIZE:
            comment: 'OSPI flash size (256M)'
            op: '='
            val: '0x1000_0000'
