args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0215_1_02160227/external/zynqmp-zcu104-sdt-full/zynqmp-zcu104-sdt-full_2026.1_0215_1_02160227.tar.gz
    - --machine-name zynqmp-zcu104-sdt-full
    - -g full

machine:
    post:
        QB_MEM:
            op: '='
            val: "-m 4G"
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-zynqmp-zcu104.dtb"
        QEMU_HW_DTB_PMU:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/zynqmp-pmu.dtb"
