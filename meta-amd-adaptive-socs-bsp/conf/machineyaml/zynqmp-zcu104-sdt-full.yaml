args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0430_1_04300623/external/zynqmp-zcu104-sdt-full/zynqmp-zcu104-sdt-full_2026.1_0430_1_04300623.tar.gz
    - --machine-name zynqmp-zcu104-sdt-full
    - -g full
    - --domain-file ${BSPLAYERDIR_amd-adaptive-socs-bsp}/conf/domainyaml/zynqmp-zcu104-cortexa53-linux-conf.yaml

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_5: y

machine:
    post:
        QB_MEM:
            op: '='
            val: "-m 4G"
        QEMU_HW_DTB_PS:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/board-zynqmp-zcu104.dtb"
        QEMU_HW_DTB_PMU:
            op: '='
            val: "${QEMU_HW_DTB_PATH}/zynqmp-pmu.dtb"
