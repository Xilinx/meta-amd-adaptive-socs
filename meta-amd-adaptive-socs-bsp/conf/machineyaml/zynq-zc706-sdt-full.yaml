args:
    - --hw-description https://petalinux.xilinx.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_1124_2_11242242/external/zynqmp-zc706-sdt-full/zynqmp-zc706-sdt-full_2026.1_1124_2_11242242.tar.gz
    - --machine-name zynq-zc706-sdt-full
    - -g full
    - --domain-file ${BSPLAYERDIR_amd-adaptive-socs-bsp}/conf/domainyaml/zynq-chosen-linux.yaml

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_5: y

machine:
    pre:
    post:
        QB_MEM:
            op: '='
            val: "-m 1024"
        QEMU_HW_SERIAL:
            op: '='
            val: "-serial null -serial mon:stdio"
