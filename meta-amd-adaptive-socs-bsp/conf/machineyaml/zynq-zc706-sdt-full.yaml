args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0419_1_04191450/external/zynq-zc706-sdt-full/zynq-zc706-sdt-full_2026.1_0419_1_04191450.tar.gz
    - --machine-name zynq-zc706-sdt-full
    - -g full
    - --domain-file ${BSPLAYERDIR_amd-adaptive-socs-bsp}/conf/domainyaml/zynq-chosen-linux.yaml

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_5: y

machine:
    pre:
    post:
        QB_MEM:
            op: '='
            val: "-m 1024"
        QEMU_HW_SERIAL:
            op: '='
            val: "-serial null -serial mon:stdio"
