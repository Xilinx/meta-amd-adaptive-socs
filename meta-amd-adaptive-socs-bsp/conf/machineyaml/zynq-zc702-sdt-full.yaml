args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_1221_1_12212350/external/zynq-zc702-sdt-full/zynq-zc702-sdt-full_2026.1_1221_1_12212350.tar.gz
    - --machine-name zynq-zc702-sdt-full
    - -g full
kconfig:
    CONFIG_YOCTO_BBMC_LINUX_DTSI: \
        ${BSPLAYERDIR_amd-adaptive-socs-bsp}/recipes-bsp/device-tree/files/zynq-zc702-sdt-full-system-conf.dtsi

machine:
    pre:
    post:
        QB_MEM:
            op: '='
            val: "-m 1024"
        QEMU_HW_SERIAL:
            op: '='
            val: "-serial null -serial mon:stdio"
