args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.2/sdt/2026.2/2026.2_0911_1_09111225/external/zynq-zc702-sdt-full/zynq-zc702-sdt-full_2026.2_0911_1_09111225.tar.gz
    - --machine-name zynq-zc702-sdt-full
    - -g full
    - --domain-file ${LAYER_PATH_xilinx-standalone-sdt}/conf/domainyaml/zynq-linux-only-base.yaml

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_5: y
    CONFIG_SUBSYSTEM_SERIAL_UART1_SELECT: y

machine:
    description: >-
        Machine configuration for the AMD Zynq-7000 ZC702 evaluation kit
        (Cortex-A9 Linux plus FSBL sub-machine), built from system
        device tree.
    pre:
    post:
        QB_MEM:
            op: '='
            val: "-m 1024"
        QEMU_HW_SERIAL:
            op: '='
            val: "-serial null -serial mon:stdio"
