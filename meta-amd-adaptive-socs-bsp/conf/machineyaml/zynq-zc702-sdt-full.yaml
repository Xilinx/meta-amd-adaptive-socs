args:
    - --hw-description https://petalinux.xilinx.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_1027_1_10281207/external/zynq-zc702-sdt-full/zynq-zc702-sdt-full_2026.1_1027_1_10281207.tar.gz
    - --machine-name zynq-zc702-sdt-full
    - -g full
kconfig:

machine:
    pre:
    post:
        QB_MEM:
            op: '='
            val: "-m 1024"
        QEMU_HW_SERIAL:
            op: '='
            val: "-serial null -serial mon:stdio"
