args:
  - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1.1/2026.1.1_0813_1_08162105/external/mbv64-scu200-revb-sdt/mbv64-scu200-revb-sdt_2026.1.1_0813_1_08162105.tar.gz
  - --machine-name mbv64-scu200-revb-sdt

machine:
    description: >-
        Machine configuration for the AMD SCU200 RevB board running a 64-bit
        AMD MicroBlaze V processor (soft-core RISC-V processor IP),
        built from system device tree.

kconfig:
    CONFIG_SUBSYSTEM_UBOOT_CONFIG_TARGET: 'xilinx_mbv64_smode_defconfig xilinx_mbv_ospi.config'
