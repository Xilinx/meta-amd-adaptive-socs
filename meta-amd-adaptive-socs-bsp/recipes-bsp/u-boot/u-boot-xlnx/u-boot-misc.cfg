CONFIG_USE_PREBOOT=y
CONFIG_PREBOOT="ufs init 0; run scsi_init;mw 0xF1D61008 1;mw 0xF1090030 1;mw 0xF1D21008 0x1;mw 0xF1A20324 0xF;mw 0xF1A40004 0x2;mw 0xF1A40000 0x2;mw 0xEB410280 0x1;mw 0xEB410284 0x1;mw 0xEB410288 0x1;mw 0xEB41028C 0x1;mw 0xEB410290 0x1;mw 0xEB410294 0x1;mw 0xEB410298 0x1;mw 0xEB41029C 0x1;mw 0xF1060A00 0x1 1"
CONFIG_BOOTCOMMAND="usb start;setenv scan_usb_dev_for_boot 'usb_scan_done=0; for devnum in 0 1 2; do if usb dev ${devnum}; then devtype=usb; part list usb ${devnum} -bootable devplist; env exists devplist; echo USB ${devnum} Boot part ${devplist}; if test $usb_scan_done -eq 0 && test ${devplist} -eq 2 && test -e usb ${devnum}:${devplist} /boot.scr; then usb_scan_done=1; echo Found U-Boot script at USB device ${devnum}:${devplist}, Hence chosing this USB boot device; part uuid ${devtype} ${devnum}:3 distro_bootpart_uuid; echo USB boot part id is ${distro_bootpart_uuid}; setenv devtype usb; setenv devnum 0; setenv bootpartnum 2; ext4load ${devtype} ${devnum}:${bootpartnum} $kernel_addr_r Image; fdt addr $fdtcontroladdr; fdt get value bootargs /chosen bootargs; setenv bootargs $bootargs root=PARTUUID=${distro_bootpart_uuid} rw rootwait; bootefi $kernel_addr_r - $fdtcontroladdr; else echo USB boot device not found ; fi; fi; done;'; run scan_usb_dev_for_boot; ext4load scsi 0:2 ${scriptaddr} boot_ufs.scr; run bootcmd_ufs;"
