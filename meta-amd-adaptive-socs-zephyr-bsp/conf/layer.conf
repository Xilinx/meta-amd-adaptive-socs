# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "amd-adaptive-socs-zephyr-bsp"
BBFILE_PATTERN_amd-adaptive-socs-zephyr-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_amd-adaptive-socs-zephyr-bsp = "6"

# Currently no files, so set an empty pattern means ignore the error
BBFILE_PATTERN_IGNORE_EMPTY_amd-adaptive-socs-zephyr-bsp = "1"

LAYERSUMMARY_amd-adaptive-socs-zephyr-bsp = "AMD adaptive SoC Zephyr BSP machine \
configurations"
LAYERDESCRIPTION_amd-adaptive-socs-zephyr-bsp = "Zephyr Board support package layer \
providing machine .conf, machine YAML, and device-tree assets for AMD \
FPGA(Microblaze-V) and Adaptive SoC's eval boards."

LAYERDEPENDS_amd-adaptive-socs-zephyr-bsp = "\
    core \
    meta-python \
    zephyrcore \
    xilinx \
    xilinx-standalone \
    xilinx-standalone-sdt \
    xilinx-microblaze \
    amd-zephyr \
    "

LAYERSERIES_COMPAT_amd-adaptive-socs-zephyr-bsp = "wrynose"
